[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electronics_design"
version = "0.2.1"
description = "General-purpose Python utilities for validating LTspice netlists."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "brosnan" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)"
]
dependencies = [
  "kicad-tools[all]>=0.20.0",
  "numba>=0.67.0",
  "networkx>=3.6.1",
  "numpy>=1.22,<2.5",
  "Pillow>=12.3.0"
]

[project.urls]
Homepage = "https://pypi.org/project/electronics_design/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
